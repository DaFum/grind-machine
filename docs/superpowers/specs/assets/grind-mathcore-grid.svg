  <title id="title">GRIND MACHINE Mathcore 7/4 rhythm anchors</title>
  <desc id="desc">An original schematic, not a device screenshot. One bar of 28 sixteenth notes grouped 3 plus 2 plus 2 quarters. Kick on steps 1, 13, 21; snare on 9, 17, 25; ride on odd-numbered steps; crash on 1. Other roles and generated optional hits are omitted.</desc>
