name: GRIND MACHINE preview

# Builds the firmware package with the Grind engine linked (GRIND_NATIVE=1) on a GitHub runner and publishes it as a
# pre-release plus the site on GitHub Pages (the gh-pages branch): the browser simulator (the GRIND build, compiled from
# the same firmware sources) at the root, the web installer, the USB editor and the package. Runs when a grind-v* tag is
# pushed, or by hand (a dry run only builds and keeps the files as a workflow artifact).
#
# It publishes a PREVIEW: the package comes from this run, it is not hardware-qualified, and the installer says so.
# The simulator is built before the package (tools/build_sim.sh, Emscripten in Docker, as the WASM lane does), and the
# assembled site is driven in a browser (tests/grind/browser_smoke.mjs) before anything is released or published: a
# site that does not work stops the run. No manual.

on:
  push:
    tags: ['grind-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (grind-v...). Leave empty for a dry run: build only, nothing published.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: grind-preview
  cancel-in-progress: false

env:
  PREVIEW_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Build, release and installer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Python (Pillow, as the native lane)
        uses: ./.github/actions/pillow-venv
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # The simulator: the same pinned Emscripten image and playwright-core as the WASM lane (grind.yml).
      - name: Use the resolved Linux amd64 Emscripten image
        run: |
          image=emscripten/emsdk@sha256:fca9b3affd2e321ab97ffc657ccc53b9fb88715997712d11d562900e6655f26f
          docker pull "$image"
          docker tag "$image" emscripten/emsdk:6.0.11
      - name: Install the pinned browser test driver
        run: npm install --prefix build/grind-browser --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.58.2
      - name: Build the simulator (GRIND build)
        env:
          GRIND_NATIVE: '1'
        run: |
          bash tools/build_sim.sh
          [ -f build/sim/fm1sim.wasm ] || { echo 'no simulator was built'; exit 1; }
      # The pinned vendor inputs share the native lane's cache entry (grind.yml). A restored copy is not trusted: the
      # extraction step checks its digests (tools/grind/native_inputs.py). A miss downloads them as before.
      - id: vendor_cache
        name: Restore the pinned vendor inputs
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.temp }}/jieli-linux-toolchains-20260730.1.tar.xz
            ${{ runner.temp }}/grind-ac79-sdk
          key: grind-vendor-v2-${{ hashFiles('tools/grind/native_inputs.py') }}
      - name: Fetch the pinned toolchain and SDK (cache miss only)
        if: steps.vendor_cache.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/jieli-linux-toolchains-20260730.1.tar.xz"
          sdk="$RUNNER_TEMP/grind-ac79-sdk"
          curl --fail --location --retry 2 --max-time 300 -o "$archive" \
            https://jl-update.oss-cn-shenzhen.aliyuncs.com/jieli-linux-toolchains-20260730.1.tar.xz
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$sdk"
      # Cache entries are immutable, so a download is saved only after it matches the pins.
      - id: vendor_verify
        name: Verify the downloaded vendor inputs before caching them
        if: steps.vendor_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          python3 - "$RUNNER_TEMP/jieli-linux-toolchains-20260730.1.tar.xz" "$RUNNER_TEMP/grind-ac79-sdk" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/grind')
          import native_inputs as n
          archive, sdk = map(Path, sys.argv[1:])
          if n.sha256(archive) != n.ARCHIVE_SHA:
              raise SystemExit('JieLi archive digest mismatch')
          n.verify_sdk(sdk)
          PY
      - name: Save the pinned vendor inputs
        if: steps.vendor_verify.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.temp }}/jieli-linux-toolchains-20260730.1.tar.xz
            ${{ runner.temp }}/grind-ac79-sdk
          key: grind-vendor-v2-${{ hashFiles('tools/grind/native_inputs.py') }}
      - name: Verify and unpack the pinned toolchain and SDK
        run: |
          archive="$RUNNER_TEMP/jieli-linux-toolchains-20260730.1.tar.xz"
          sdk="$RUNNER_TEMP/grind-ac79-sdk"
          tools="$RUNNER_TEMP/jieli-tools"
          mkdir -p "$tools"
          python3 tools/grind/native_inputs.py "$archive" "$sdk" "$tools"
          echo "JIELI_TOOLCHAIN=$tools/jieli-linux-toolchains-20260730.1" >> "$GITHUB_ENV"
          echo "AC79_SDK=$sdk" >> "$GITHUB_ENV"
      - name: Build the package and the installer
        env:
          GRIND_NATIVE: '1'
          DRUM_PACKAGE: '1'
          FELUCCA_BLE: '0'
          JIELI_DOCKER: '0'
        run: |
          ./build.sh 2>&1 | tee build-log.txt
          python3 - <<'PY'
          import glob, sys
          sys.path.insert(0, 'tools')
          import fm1_install as I
          for f in glob.glob('build/site/firmware/*.fwsc'):
              p = I.product_of(open(f, 'rb').read())
              print(f, 'identity', p)
              assert p == 'FM-1_984', 'the package must carry this firmware own identity, not ' + p
          PY
          ls -l build/site/firmware build/site/webapp/installer
      - name: Collect what is published
        id: collect
        run: |
          set -eu
          pkg=$(ls build/site/firmware/*.fwsc | head -1)
          [ -n "$pkg" ] || { echo 'no package'; exit 1; }
          sha=$(git rev-parse --short HEAD)
          out=publish
          rm -rf "$out"
          mkdir -p "$out/site/webapp" "$out/files"
          [ -f build/site/fm1sim.wasm ] || { echo 'the site has no simulator (build/sim was not picked up)'; exit 1; }
          find build/site -maxdepth 1 -type f -exec cp {} "$out/site/" \;   # the landing page and the simulator's files
          cp -R build/site/firmware "$out/site/"
          cp -R build/site/webapp/installer build/site/webapp/editor "$out/site/webapp/"
          touch "$out/site/.nojekyll"
          cp "$pkg" "$out/files/grind-machine-$sha.fwsc"
          cp LICENSE LICENSING.md "$out/files/"
          (cd build/site/firmware && zip -qr "../../../$out/files/LICENSES.zip" LICENSES)
          sha256sum "$out"/files/* | tee "$out/files/SHA256SUMS.txt"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pkg=grind-machine-$sha.fwsc" >> "$GITHUB_OUTPUT"
      - name: Drive the assembled site in a browser
        env:
          GRIND_NATIVE: '1'
        run: |
          chrome=$(command -v google-chrome || command -v chromium || true)
          [ -x "$chrome" ] || { echo 'no Chrome on the runner'; exit 1; }
          GRIND_CHROMIUM="$chrome" node tests/grind/browser_smoke.mjs publish/site
      - name: Keep the files of this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grind-machine-preview-${{ steps.collect.outputs.sha }}
          path: |
            publish/site
            publish/files
            build-log.txt
          retention-days: 30
      - name: Pre-release
        if: env.PREVIEW_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.collect.outputs.sha }}
        run: |
          set -eu
          repo="$GITHUB_REPOSITORY"
          owner=${repo%%/*}; name=${repo##*/}
          cat > publish/notes.md <<EOF
          **Preview build, not tested on a real FM-1.** It was built by a GitHub Actions run from commit \`$SHA\` with the Grind engine linked (\`GRIND_NATIVE=1\`); it is not a hardware-qualified release. The GRIND pages (ARP, then ARP again after GRIDS) generate 22 rhythm styles; see CHANGELOG.md.

          Install: https://${owner,,}.github.io/$name/webapp/installer/ (Chrome or Edge, over USB). The package holds JieLi SDK files under Apache-2.0 and the Hügelton Sample Pack (all rights reserved): see LICENSING.md and LICENSES.zip. SHA-256 sums are in SHA256SUMS.txt.
          EOF
          if gh release view "$PREVIEW_TAG" >/dev/null 2>&1; then
            gh release upload "$PREVIEW_TAG" publish/files/* --clobber
            gh release edit "$PREVIEW_TAG" --prerelease --title "GRIND MACHINE preview $PREVIEW_TAG" --notes-file publish/notes.md
          else
            gh release create "$PREVIEW_TAG" publish/files/* --prerelease --target "$GITHUB_SHA" \
              --title "GRIND MACHINE preview $PREVIEW_TAG" --notes-file publish/notes.md
          fi
      - name: Installer on GitHub Pages (gh-pages branch)
        if: env.PREVIEW_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.collect.outputs.sha }}
        run: |
          set -eu
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf pages
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch gh-pages "$remote" pages
          else
            mkdir pages && git -C pages init -q -b gh-pages && git -C pages remote add origin "$remote"
          fi
          git -C pages rm -rqf --ignore-unmatch . >/dev/null 2>&1 || true
          cp -R publish/site/. pages/
          git -C pages config user.name 'github-actions[bot]'
          git -C pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C pages add -A
          git -C pages commit -qm "GRIND MACHINE preview $SHA: simulator, installer, editor" || echo 'the site is unchanged'
          git -C pages push -q origin HEAD:refs/heads/gh-pages
          gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1 ||
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f 'source[branch]=gh-pages' -f 'source[path]=/' >/dev/null 2>&1 ||
            echo 'Pages is not turned on yet: Settings > Pages > Deploy from a branch > gh-pages'
          echo "Simulator: https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY##*/}/ | Installer: https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY##*/}/webapp/installer/" | tee -a "$GITHUB_STEP_SUMMARY"
