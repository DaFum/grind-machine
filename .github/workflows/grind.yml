name: GRIND Foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grind-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-core:
    name: Host Core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      status: ${{ steps.checks.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: checks
        run: bash tools/grind/run_ci.sh host-core
      - name: Upload Host Core evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grind-host-core-evidence-attempt-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            build/grind-evidence/audit-tests.log
            build/grind-evidence/grind-core.log

  host-upstream:
    name: Host Upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      status: ${{ steps.checks.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: ./.github/actions/pillow-venv
      - id: checks
        run: bash tools/grind/run_ci.sh host-upstream
      - name: Upload Host Upstream evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grind-host-upstream-evidence-attempt-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: build/grind-evidence/host-upstream.log

  performance:
    name: Performance
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      status: ${{ steps.checks.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: ./.github/actions/pillow-venv
      - id: checks
        run: bash tools/grind/run_ci.sh performance
      - name: Upload Performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grind-performance-evidence-attempt-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: build/grind-evidence/performance.log

  wasm:
    name: WASM and web
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EMSDK_DIGEST: sha256:fca9b3affd2e321ab97ffc657ccc53b9fb88715997712d11d562900e6655f26f
      EMSDK_ID: sha256:b4584bcb016b5416c2eb606e3aeffa7461a63037c0ba4cc8e83c6df3ffb532ba   # its config digest
      PLAYWRIGHT_CORE: 1.58.2
    outputs:
      status: ${{ steps.checks.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: ./.github/actions/pillow-venv
      # The pinned image is cached as a docker save archive. A restored copy is used only when its image ID is the pinned
      # config digest (EMSDK_ID; the containerd image store reports the manifest digest EMSDK_DIGEST instead). Otherwise
      # it is pulled by digest as before, and saved only after the pulled image matches the pin.
      - id: emsdk_cache
        name: Restore the pinned Emscripten image
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/emsdk-image.tar
          key: grind-emsdk-v1-${{ env.EMSDK_DIGEST }}
      - id: emsdk
        name: Use the resolved Linux amd64 Emscripten image
        env:
          CACHE_HIT: ${{ steps.emsdk_cache.outputs.cache-hit }}
        run: |
          archive="$RUNNER_TEMP/emsdk-image.tar"
          image="emscripten/emsdk@$EMSDK_DIGEST"
          id_of() { docker image inspect --format '{{.Id}}' "$1" 2>/dev/null; }
          pinned() { case $(id_of "$1") in "$EMSDK_ID"|"$EMSDK_DIGEST") return 0 ;; *) return 1 ;; esac; }
          if [ "$CACHE_HIT" = true ] && docker load -i "$archive" && pinned emscripten/emsdk:6.0.11; then
            echo "Emscripten image $(id_of emscripten/emsdk:6.0.11): restored from the cache"
          else
            docker image rm -f emscripten/emsdk:6.0.11 >/dev/null 2>&1 || true
            docker pull "$image"
            docker tag "$image" emscripten/emsdk:6.0.11
            if pinned "$image"; then
              docker save -o "$archive" emscripten/emsdk:6.0.11 && echo 'save=1' >> "$GITHUB_OUTPUT"
            else
              echo "::warning title=Emscripten cache::pulled image ID $(id_of "$image") differs from EMSDK_ID; not cached"
            fi
          fi
      - name: Save the pinned Emscripten image
        if: steps.emsdk.outputs.save == '1' && steps.emsdk_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/emsdk-image.tar
          key: grind-emsdk-v1-${{ env.EMSDK_DIGEST }}
      - id: browser_cache
        name: Restore the pinned browser test driver
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: build/grind-browser/node_modules
          key: grind-playwright-core-v1-${{ runner.os }}-${{ env.PLAYWRIGHT_CORE }}
      - name: Install the pinned browser test driver
        env:
          CACHE_HIT: ${{ steps.browser_cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ] && node -e 'process.exit(require(process.argv[1]).version === process.argv[2] ? 0 : 1)' \
            "$PWD/build/grind-browser/node_modules/playwright-core/package.json" "$PLAYWRIGHT_CORE"; then
            echo "playwright-core $PLAYWRIGHT_CORE: restored from the cache"
          else
            rm -rf build/grind-browser/node_modules
            npm install --prefix build/grind-browser --no-save --ignore-scripts --no-audit --no-fund "playwright-core@$PLAYWRIGHT_CORE"
          fi
      - id: checks
        run: bash tools/grind/run_ci.sh wasm
      - name: Upload WASM and web evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grind-wasm-evidence-attempt-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            build/grind-evidence/grind-core-wasm.log
            build/grind-evidence/wasm-preview.log
            build/grind-evidence/wasm-preview-native*.log
            build/grind-evidence/web-regression.log
            build/grind-evidence/web-editor.log
            build/grind-evidence/browser-smoke.log
            build/grind-evidence/browser-smoke-native*.log

  native:
    name: Native firmware and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      status: ${{ steps.checks.outputs.status }}
      t03_native: ${{ steps.checks.outputs.t03_native }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Restore upstream release refs
        run: |
          git fetch --no-tags https://github.com/DeadActive/hortator.git 'refs/tags/drum-v*:refs/tags/drum-v*' ||
            echo 'BLOCKED: upstream release refs unavailable; the native build can still run'
      - name: Prepare native Python environment
        uses: ./.github/actions/pillow-venv
      # The two pinned vendor inputs are cached before the build touches them. A restored copy is not trusted: the build
      # step still checks its digests (tools/grind/native_inputs.py). A miss downloads them as before.
      - id: vendor_cache
        name: Restore the pinned vendor inputs
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.temp }}/jieli-linux-toolchains-20260730.1.tar.xz
            ${{ runner.temp }}/grind-ac79-sdk
          key: grind-vendor-v2-${{ hashFiles('tools/grind/native_inputs.py') }}
      - id: vendor
        name: Download the pinned vendor inputs (cache miss only)
        if: steps.vendor_cache.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/jieli-linux-toolchains-20260730.1.tar.xz"
          sdk="$RUNNER_TEMP/grind-ac79-sdk"
          if ! curl --fail --location --retry 2 --max-time 150 -o "$archive" \
            https://jl-update.oss-cn-shenzhen.aliyuncs.com/jieli-linux-toolchains-20260730.1.tar.xz ||
            ! git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$sdk"; then
            echo 'BLOCKED: pinned vendor inputs could not be downloaded' | tee -a "$GITHUB_STEP_SUMMARY"
            echo 'blocked=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi
      # Cache entries are immutable, so a download is saved only after it matches the pins. The key follows the pins in
      # native_inputs.py, so changing a digest or the SDK commit there starts a fresh entry.
      - id: vendor_verify
        name: Verify the downloaded vendor inputs before caching them
        if: steps.vendor_cache.outputs.cache-hit != 'true' && steps.vendor.outputs.blocked != '1'
        continue-on-error: true
        run: |
          python3 - "$RUNNER_TEMP/jieli-linux-toolchains-20260730.1.tar.xz" "$RUNNER_TEMP/grind-ac79-sdk" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/grind')
          import native_inputs as n
          archive, sdk = map(Path, sys.argv[1:])
          if n.sha256(archive) != n.ARCHIVE_SHA:
              raise SystemExit('JieLi archive digest mismatch')
          n.verify_sdk(sdk)
          PY
      - name: Save the pinned vendor inputs
        if: steps.vendor_verify.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.temp }}/jieli-linux-toolchains-20260730.1.tar.xz
            ${{ runner.temp }}/grind-ac79-sdk
          key: grind-vendor-v2-${{ hashFiles('tools/grind/native_inputs.py') }}
      - id: checks
        name: Verify inputs and build on the ephemeral runner
        env:
          GRIND_NATIVE: '1'   # link the Grind engine and its GRIND pages: this lane measures their RAM, flash and ISR cost
          VENDOR_BLOCKED: ${{ steps.vendor.outputs.blocked }}
        run: |
          archive="$RUNNER_TEMP/jieli-linux-toolchains-20260730.1.tar.xz"
          sdk="$RUNNER_TEMP/grind-ac79-sdk"
          if [ "$VENDOR_BLOCKED" = 1 ]; then
            echo 'status=BLOCKED' >> "$GITHUB_OUTPUT"
            exit 2
          fi
          GRIND_JIELI_ARCHIVE="$archive" AC79_SDK="$sdk" bash tools/grind/run_ci.sh native

      # Upload only reviewed text outputs. Build directories also contain release-restricted material.
      - name: Upload native build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grind-native-evidence-attempt-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            build/grind-evidence/native-inputs.log
            build/grind-evidence/native-build.log
            build/grind-evidence/frozen-baseline.log
            build/grind-evidence/historical-ref.log
            build/grind-evidence/native-host.log
            build/grind-evidence/native-sha256.txt
            build/grind-evidence/resources.json
            build/grind-evidence/T03/native.json

  license:
    name: Asset and license evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      status: ${{ steps.checks.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: checks
        run: bash tools/grind/run_ci.sh license || test "$?" -eq 2
      - name: Upload asset and license evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grind-license-evidence-attempt-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: build/grind-evidence/assets.log

  foundation-gate:
    name: Foundation gate
    if: always()
    needs: [host-core, host-upstream, wasm, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HOST_CORE: ${{ (needs.host-core.outputs.status == 'PASS' && needs.host-core.result != 'success' && 'FAIL') || needs.host-core.outputs.status || needs.host-core.result }}
      HOST_UPSTREAM: ${{ (needs.host-upstream.outputs.status == 'PASS' && needs.host-upstream.result != 'success' && 'FAIL') || needs.host-upstream.outputs.status || needs.host-upstream.result }}
      WASM: ${{ (needs.wasm.outputs.status == 'PASS' && needs.wasm.result != 'success' && 'FAIL') || needs.wasm.outputs.status || needs.wasm.result }}
      NATIVE: ${{ (needs.native.outputs.status == 'PASS' && needs.native.result != 'success' && 'FAIL') || needs.native.outputs.status || needs.native.result }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: t03
        name: Assemble and validate the current T03 audit
        continue-on-error: true
        env:
          T03_NATIVE: ${{ needs.native.outputs.t03_native }}
        run: bash tools/grind/run_ci.sh t03
      - name: Require applicable Foundation checks
        if: always()
        env:
          T03: ${{ steps.t03.outputs.status || steps.t03.outcome }}
        shell: bash
        run: |
          failed=0
          for lane in HOST_CORE HOST_UPSTREAM WASM NATIVE T03; do
            case "${!lane}" in
              PASS) status=PASS ;;
              FAIL|failure) status=FAIL ;;
              SKIPPED) status=SKIPPED ;;
              *) status=BLOCKED ;;
            esac
            printf -- '- **%s** %s (%s)\n' "$status" "$lane" "${!lane}" | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ $lane != T03 && $status != PASS ]]; then failed=1; fi
          done
          exit "$failed"
      - name: Upload T03 audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grind-t03-evidence-attempt-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            build/grind-evidence/T03/audit.json
            build/grind-evidence/T03/audit.log
